  <text x="500" y="432" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#111111">
    for successfully coordinating in the <tspan font-weight="700" font-style="italic">Odoo × Indus University Hackathon ’26</tspan>, organized
  </text>
