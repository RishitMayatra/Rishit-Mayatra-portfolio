    June 2026, organized by the <tspan font-weight="700">Computer Engineering Department, Indus</tspan>
  </text>
  <text x="508" y="484" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#0d2340">
    <tspan font-weight="700">Institute of Technology and Engineering,</tspan> Indus University.
  </text>

