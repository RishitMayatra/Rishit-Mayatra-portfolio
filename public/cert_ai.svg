  <text x="495" y="656" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#0d2340">Department,</text>
  <text x="495" y="674" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#0d2340">Indus University</text>

