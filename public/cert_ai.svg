  <!-- Main Heading -->
  <text x="500" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="2" fill="#0d2340">CERTIFICATE</text>
  <text x="500" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" letter-spacing="1.5" fill="#0d2340">OF ACHIEVEMENT</text>

  <text x="500" y="262" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" letter-spacing="1" fill="#0d2340">THIS CERTIFICATE IS PRESENTED TO :</text>
  <text x="500" y="342" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="56" fill="#162f65">Rishit Haresh Mayatra</text>

  <!-- Body Text -->
  <text x="508" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#0d2340">
    On successful completion of the <tspan font-weight="700">Certification Program</tspan> on
  </text>
  <text x="508" y="428" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#0d2340">
